name: MAF26 Interval Tracker (cloud backup)

# Public-repo backup for shared/maf-interval-tracker. The LAPTOP (Windows Task Scheduler)
# is primary; this fills any slot the laptop misses (laptop off in the evenings).
# Public repo = unlimited free Actions minutes — REQUIRED because each run IDLES ~2.5h
# waiting for the exact slot minute, which on a private repo would burn ~150 billed min/run
# and blow the 2,000-min account cap.
#
# GitHub cron fires 30-90+ min late, so each cron starts ~2.5h EARLY and the script
# (--target=HHMM) sleeps until 1 min past the slot, then fills "as of now" (honest if late).
# --skip-if-filled makes it exit silently when the laptop already wrote that slot.
# The script's own run-dates.json gate (per-brand since 24 Jul 2026) makes non-round
# days a fast no-op.
#
# BOTH brands run in ONE job, SEQUENTIALLY (MLB to completion, then LLV) since 3 Aug 2026 —
# each brand only proceeds on ITS OWN armed dates, so a round-close day for one brand is a
# no-op for the other.
#
# WHY NOT A MATRIX (it was one, 24 Jul - 3 Aug 2026): two parallel jobs hitting the same slot
# minute interleaved their Telegram messages — MLB text, LLV text, MLB photos, LLV photos —
# because the screenshots take ~10s longer to build than the text. Colin wants MLB text +
# MLB screenshots, then LLV text + LLV screenshots. Sequential in one job makes it
# deterministic. NOTE: `max-parallel: 1` on the matrix would NOT have worked — LLV's job
# would only start after MLB's finished, and MLB's job includes the ~2.5h idle wait, so
# LLV would wake long after its slot. Running both inside one job after ONE wait is the fix:
# MLB sleeps to slot+1min, fills, sends; LLV then sees the target already passed and its
# wait loop proceeds immediately (`waitMin <= 0` branch in tracker.js).
# LLV must run even if MLB fails — hence `set +e` and the explicit exit-code roll-up.

on:
  schedule:
    - cron: '30 9 * * *'    # 17:30 UTC start -> target 2000 SGT (12:00 UTC)
    - cron: '0 11 * * *'    # 19:00 UTC start -> target 2130 SGT (13:30 UTC)
    - cron: '30 12 * * *'   # 20:30 UTC start -> target 2300 SGT (15:00 UTC)
  workflow_dispatch:
    inputs:
      target:
        description: 'Slot HHMM to target (e.g. 2000). Blank = nearest slot now.'
        required: false
        default: ''
      apply:
        description: 'Write to the sheet (false = dry-run)'
        type: boolean
        default: false
      force:
        description: 'Ignore the run-dates gate (testing only)'
        type: boolean
        default: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency:
      group: interval-tracker-${{ github.event.schedule || github.event.inputs.target || github.run_id }}
      cancel-in-progress: false
    env:
      TZ: Asia/Singapore
      # Both brands' creds are in the job env; the run step picks the right pair per brand.
      MLB_META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      MLB_WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
      MLB_WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
      LLV_META_ACCESS_TOKEN: ${{ secrets.LLV_META_ACCESS_TOKEN }}
      LLV_WC_CONSUMER_KEY: ${{ secrets.LLV_WOOCOMMERCE_CONSUMER_KEY }}
      LLV_WC_CONSUMER_SECRET: ${{ secrets.LLV_WOOCOMMERCE_CONSUMER_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install screenshot deps (render-shot.py)
        run: |
          python3 -m pip install --quiet pypdfium2 pillow
          python3 -c "import pypdfium2, PIL; print('render deps OK')"
      - name: Map schedule -> target slot
        id: map
        run: |
          case "${{ github.event.schedule }}" in
            "30 9 * * *")  echo "target=2000" >> "$GITHUB_OUTPUT" ;;
            "0 11 * * *")  echo "target=2130" >> "$GITHUB_OUTPUT" ;;
            "30 12 * * *") echo "target=2300" >> "$GITHUB_OUTPUT" ;;
            *)             echo "target=${{ github.event.inputs.target }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Run tracker (MLB, then LLV — order matters, see header)
        run: |
          ARGS="--skip-if-filled"
          TARGET="${{ steps.map.outputs.target }}"
          if [ -n "$TARGET" ]; then ARGS="$ARGS --target=$TARGET"; fi
          # scheduled runs always write; manual dispatch writes only if apply=true
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.apply }}" = "true" ]; then
            ARGS="$ARGS --apply"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi

          # LLV must run even if MLB fails, so don't let -e kill the step early.
          set +e
          rc_total=0

          echo "::group::MLB"
          BRAND=MLB \
            META_ACCESS_TOKEN="$MLB_META_ACCESS_TOKEN" \
            WC_CONSUMER_KEY="$MLB_WC_CONSUMER_KEY" \
            WC_CONSUMER_SECRET="$MLB_WC_CONSUMER_SECRET" \
            node tracker.js $ARGS
          rc_mlb=$?
          echo "::endgroup::"
          echo "MLB exit=$rc_mlb"
          [ $rc_mlb -ne 0 ] && rc_total=1

          echo "::group::LLV"
          BRAND=LLV \
            META_ACCESS_TOKEN="$LLV_META_ACCESS_TOKEN" \
            WC_CONSUMER_KEY="$LLV_WC_CONSUMER_KEY" \
            WC_CONSUMER_SECRET="$LLV_WC_CONSUMER_SECRET" \
            node tracker.js $ARGS
          rc_llv=$?
          echo "::endgroup::"
          echo "LLV exit=$rc_llv"
          [ $rc_llv -ne 0 ] && rc_total=1

          echo "--- summary: MLB=$rc_mlb LLV=$rc_llv ---"
          exit $rc_total
